<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grupo Ethernos — Avaliação de proteção familiar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --cream: #F7F4EC;
        --teal-900: #0F3B3C;
        --teal-700: #175454;
        --sage: #DCE5D6;
        --gold: #B8903C;
        --gold-light: #EFE1C4;
        --ink: #22261F;
        --ink-soft: #565B4F;
        --line: #D8D2C2;
        --radius: 14px;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--cream);
        color: var(--ink);
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, .serif { font-family: 'Source Serif 4', serif; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px; }

      /* HERO */
      .hero { padding: 64px 0 40px; text-align: left; }
      .hero .brand {
        font-size: 14px; letter-spacing: .02em; color: var(--teal-700);
        font-weight: 600; margin-bottom: 28px;
      }
      .hero h1 {
        font-size: 34px; line-height: 1.25; font-weight: 600; color: var(--teal-900);
        max-width: 480px;
      }
      .hero p {
        margin-top: 16px; font-size: 16px; color: var(--ink-soft); max-width: 440px;
      }
      .hero .cta {
        margin-top: 32px;
      }

      button.primary {
        background: var(--teal-900); color: var(--cream); border: none;
        padding: 15px 28px; border-radius: 8px; font-size: 15px; font-weight: 500;
        font-family: 'Inter', sans-serif; cursor: pointer; transition: background .15s ease;
      }
      button.primary:hover { background: var(--teal-700); }
      button.primary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

      button.ghost {
        background: transparent; border: 1px solid var(--line); color: var(--ink-soft);
        padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer;
        font-family: 'Inter', sans-serif;
      }
      button.ghost:hover { border-color: var(--teal-700); color: var(--teal-900); }

      /* QUIZ CARD */
      .stage { display: none; }
      .stage.active { display: block; }

      .card {
        background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
        padding: 36px 32px; margin-bottom: 64px;
      }

      .progress { display: flex; gap: 6px; margin-bottom: 28px; }
      .progress span { height: 3px; flex: 1; background: var(--line); border-radius: 2px; overflow: hidden; }
      .progress span i { display: block; height: 100%; width: 0%; background: var(--gold); transition: width .3s ease; }
      .progress span.done i { width: 100%; }
      .progress span.current i { width: 100%; }

      .q-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
      .q-title { font-size: 21px; font-weight: 600; color: var(--teal-900); margin-bottom: 24px; }

      .options { display: flex; flex-direction: column; gap: 10px; }
      .opt {
        border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px;
        cursor: pointer; font-size: 15px; color: var(--ink);
        transition: border-color .15s ease, background .15s ease;
      }
      .opt:hover { border-color: var(--gold); background: var(--gold-light); }
      .opt.selected { border-color: var(--teal-900); background: var(--sage); }

      .nav-row { display: flex; justify-content: space-between; align-items: center; margin-top: 28px; }

      /* PLAN COMPARISON */
      a.whatsapp {
        display: inline-block; background: var(--teal-900); color: var(--cream);
        text-decoration: none; padding: 18px 32px; border-radius: 8px; font-size: 15px; font-weight: 500;
        text-align: center;
      }
      a.whatsapp:hover { background: var(--teal-700); }

      .microcopy {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 8px;
      }

      .plans-compare { display: flex; flex-direction: column; gap: 14px; margin-bottom: 28px; }
      .plan-card {
        border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px;
        position: relative;
      }
      .plan-card.recommended { border: 2px solid var(--gold); background: var(--gold-light); }
      .plan-card .tag {
        display: inline-block; background: var(--gold); color: #fff;
        font-size: 11px; font-weight: 600; letter-spacing: .03em;
        padding: 3px 10px; border-radius: 100px; margin-bottom: 10px;
      }
      .plan-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
      .plan-card .name { font-size: 18px; font-weight: 600; color: var(--teal-900); }
      .plan-card .price { font-size: 15px; font-weight: 600; color: var(--teal-900); }
      .plan-card .includes { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }
      .plan-card ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
      .plan-card li { font-size: 14px; color: var(--ink); padding-left: 18px; position: relative; }
      .plan-card li::before { content: "✓"; position: absolute; left: 0; color: var(--teal-700); font-weight: 600; }

      /* FOOTER */
      footer {
        padding: 40px 0 20px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .footer-cols {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 32px;
      }
      .footer-col {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .footer-col.brand-col .brand-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--teal-900);
        margin-bottom: 2px;
      }
      .footer-col .col-title {
        font-weight: 600;
        color: var(--teal-900);
        margin-bottom: 6px;
        font-size: 14px;
      }
      .footer-col a {
        color: var(--ink-soft);
        text-decoration: none;
      }
      .footer-bottom {
        border-top: 1px solid var(--line);
        padding-top: 24px;
        font-size: 12px;
        color: var(--ink-soft);
        text-align: center;
      }

      @media(max-width: 480px){
        .hero { padding: 48px 0 32px; }
        .hero h1 { font-size: 28px; }
        .card { padding: 28px 22px; }
        .footer-cols {
          flex-direction: column;
          gap: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
